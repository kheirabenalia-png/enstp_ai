<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Guide d'étudiants d'ENSTP</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
}

.welcome {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    color: white;
    padding: 30px;

    background-image:
        linear-gradient(rgba(0, 30, 60, 0.60), rgba(0, 30, 60, 0.60)),
        url("https://raw.githubusercontent.com/kheirabenalia-png/enstp_ai/main/592022075563311913_120.jpg");

    background-size: cover;
    background-position: center;
}

.content {
    max-width: 850px;
}

.logo {
    font-size: 60px;
}

h1 {
    font-size: 50px;
    margin: 10px 0;
}

h2 {
    font-size: 28px;
    font-weight: normal;
}

p {
    font-size: 19px;
    line-height: 1.6;
}

button {
    margin-top: 25px;
    padding: 15px 35px;
    border: none;
    border-radius: 30px;
    background: white;
    color: #07558c;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
}

.photos {
    margin-top: 30px;
    display: flex;
    justify-content: center;
    gap: 15px;
}

.photos img {
    width: 140px;
    height: 90px;
    object-fit: cover;
    border-radius: 10px;
    border: 2px solid white;
}

@media (max-width: 600px) {
    h1 {
        font-size: 38px;
    }

    h2 {
        font-size: 22px;
    }

    p {
        font-size: 16px;
    }

    .photos img {
        width: 90px;
        height: 60px;
    }
}
</style>
</head>

<body>

<section class="welcome">

<div class="content">

<div class="logo">🎓</div>

<h1>ENSTP</h1>

<h2>Guide d'étudiants d'ENSTP</h2>

<p>
Bienvenue dans votre guide étudiant.
Découvrez l'ENSTP, l'enseignement,
la vie quotidienne et les services utiles aux étudiants.
</p>

<button onclick="commencer()">
🚀 Commencer
</button>

<div class="photos">

<img src="https://raw.githubusercontent.com/kheirabenalia-png/enstp_ai/main/592022075563311916_120.jpg"
alt="Étudiants ENSTP">

<img src="https://raw.githubusercontent.com/kheirabenalia-png/enstp_ai/main/592022075563311918_120.jpg"
alt="Étudiants ENSTP">

</div>

</div>

</section>

<script>
function commencer() {
    alert("Bienvenue dans Guide d'étudiants d'ENSTP !");
}
</script>

</body>
</html>
